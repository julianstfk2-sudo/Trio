<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8a3b5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trio">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--accM:#8a3b5e;--bgM:#f3eaef;--accF:#1e5b66;--bgF:#e7eff0;--accC:#a86a12;--bgC:#f5eedf;--accE:#3d6b2f;--bgE:#eaf0e1;--card:#fff;--ink:#241c20;--mute:#6f6168;--g:#2e7d4f;--y:#a76b00;--r:#c0392b;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--accM:#e08fb0;--bgM:#1d1318;--accF:#6fc1ce;--bgF:#101b1e;--accC:#e9b652;--bgC:#1e1910;--accE:#9ccc7a;--bgE:#141a10;--card:#1f1f23;--ink:#f1eaee;--mute:#a99ba2;--g:#6fcf97;--y:#f2c14e;--r:#ff8a7a;--on:#16100f}}
:root[data-theme=dark]{--accM:#e08fb0;--bgM:#1d1318;--accF:#6fc1ce;--bgF:#101b1e;--accC:#e9b652;--bgC:#1e1910;--accE:#9ccc7a;--bgE:#141a10;--card:#1f1f23;--ink:#f1eaee;--mute:#a99ba2;--g:#6fcf97;--y:#f2c14e;--r:#ff8a7a;--on:#16100f}
html[data-mode=m]{--acc:var(--accM);--bg:var(--bgM)}html[data-mode=f]{--acc:var(--accF);--bg:var(--bgF)}
html[data-mode=c]{--acc:var(--accC);--bg:var(--bgC)}html[data-mode=e]{--acc:var(--accE);--bg:var(--bgE)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;font-weight:600;margin:0 0 10px}h1{font-size:30px}h2{font-size:21px}h3{font-size:17px}
p{margin:0 0 10px}.mute,small{color:var(--mute)}
.card{background:var(--card);border-radius:22px;padding:18px;margin:0 0 16px}
.btn{display:block;width:100%;min-height:48px;margin-top:12px;border:0;border-radius:14px;background:var(--acc);color:var(--on);font-weight:600;font-size:16px}
.btn.s{background:#8882;color:var(--ink)}.btn.d{background:var(--r);color:var(--on)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:0;border-radius:99px;padding:9px 13px;background:#8881;color:var(--ink);font-size:15px}.chip.on{background:var(--acc);color:var(--on)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.moods .chip{border-radius:12px;min-height:44px;font-weight:600}
input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #8884;border-radius:12px;background:transparent;color:inherit;font:inherit}
input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--acc);flex:none}input[type=range]{padding:0;border:0;accent-color:var(--acc)}
.ck{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.ring{position:relative;width:190px;height:190px;margin:4px auto 10px}.ring svg{width:100%;height:100%}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc b{font:600 62px/1 "Iowan Old Style",Georgia,serif}.rc small{font-size:12px}
.c{text-align:center}.hint{background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:14px;padding:12px;margin:8px 0}
.tl{display:flex;gap:12px;align-items:center;padding:16px;border-radius:18px;color:var(--on);margin-bottom:12px}.tl b{font-size:28px}
.tl.g{background:var(--g)}.tl.y{background:var(--y)}.tl.r{background:var(--r)}
.fd{border-left:5px solid;padding:8px 12px;margin:10px 0;border-radius:4px}.fd.g{border-color:var(--g)}.fd.y{border-color:var(--y)}.fd.r{border-color:var(--r)}
.ev{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:6px 10px}
details{margin:0 0 16px}summary{color:var(--mute);padding:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid #8882}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:6px 0;font-size:12px;font-weight:600}nav button.on{color:var(--acc)}nav b{display:block;font-size:20px}
[hidden]{display:none!important}
.mo{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px;padding:8px 2px}.mo small{font-size:10px;line-height:1.1;text-align:center}
.chip small,.tl small{color:inherit}
.bar{height:10px;border-radius:5px;background:#8882;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
details.card summary{color:var(--ink);font-weight:600;padding:0}
.pimg{width:64px;height:64px;object-fit:contain;border-radius:12px;background:#fff;flex:none}
</style></head><body>
<main id="app"></main>
<nav>
<button data-a="mode" data-v="m"><b>🌿</b>Mutter</button><button data-a="mode" data-v="f"><b>🤝</b>Vater</button>
<button data-a="mode" data-v="c"><b>👥</b>Paar</button><button data-a="mode" data-v="e"><b>🍎</b>Essen</button>
</nav>
<script>
// ---------- Zustand (nur lokal in diesem Browser) ----------
const K='trio.v1';let S={};
try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({due:'',phase:'active',mode:'m',log:[],me:[],ev:[],wk:{},mid:{},plan:{},team:{},myAll:[],role:'',wt:[],dr:[],h:'',w0:'',goal:2000},S);
const put=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let D={mood:3,sy:[],note:'',share:false},P={mood:3,note:''},W={c:3,h:3,w:''},F={res:null,msg:'',code:'',txt:'',cam:false,al:[],name:'',img:''},DR={k:'w'},UI={};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('de-DE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const PG=()=>{if(!S.due)return null;const n=Math.min(300,Math.max(0,(Date.now()-(new Date(S.due).getTime()-280*864e5))/864e5)),w=Math.min(42,Math.floor(n/7));return{w,d:Math.floor(n-w*7),f:Math.min(42,n/7)}};
const week=()=>PG()?PG().w:null;
const sswOf=t=>(t-(new Date(S.due).getTime()-280*864e5))/(7*864e5);
const SIZE=[[4,'ein Mohnsamen'],[8,'eine Himbeere'],[12,'eine Limette'],[16,'eine Avocado'],[20,'eine Banane'],[24,'ein Maiskolben'],[28,'eine Aubergine'],[32,'eine Kokosnuss'],[36,'ein Romanasalat'],[40,'eine Wassermelone']];
const SY=[['tired','Erschöpft'],['nausea','Übelkeit'],['back','Rückenschmerzen'],['head','Kopfschmerzen'],['sleep','Schlecht geschlafen'],['low','Bedrückt'],['worry','Sorgen']];
const MID={1:[['a','Hebamme suchen und anfragen (früh, Plätze sind knapp)'],['b','Ersten Vorsorgetermin vereinbaren'],['c','Vitamine mit Ärzt:in klären']],2:[['d','Geburtsvorbereitungskurs anmelden'],['e','Infoabend der Wunschklinik besuchen'],['f','Wochenbett-Betreuung mit der Hebamme klären']],3:[['g','Kliniktasche packen'],['h','Geburtswünsche mit der Hebamme besprechen'],['i','Unterlagen für Klinik und Mutterschutz bereithalten']]};
const PLAN=[['p1','Elternzeit-Wünsche mit dem Arbeitgeber besprechen'],['p2','Antrag auf Elternzeit vorbereiten (Frist vorab prüfen)'],['p3','Elterngeld-Varianten vergleichen (Familienportal des Bundes)'],['p4','Unterlagen sammeln']];
const TEAM=[['t1','Klinik oder Geburtshaus anmelden'],['t2','Geburtswünsche gemeinsam aufschreiben'],['t3','Rollen klären: Wer ruft wen an?'],['t4','Kliniktasche packen'],['t5','Notfallkontakte eintragen']];
const chk=(st,items)=>items.map(([id,t])=>`<label class="ck"><input type="checkbox" data-c="tick" data-s="${st}" data-v="${id}" ${S[st][id]?'checked':''}><span>${t}</span></label>`).join('');
const SOS='Rund um die Uhr erreichst du die Telefonseelsorge unter 0800 111 0 111 (kostenlos).';

// ---------- Bausteine ----------
const nf=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1}),gram=g=>g>=1000?nf(g/1000)+' kg':Math.round(g)+' g';
const MOOD=[['😣','sehr schlecht'],['😕','schlecht'],['😐','geht so'],['🙂','gut'],['😄','sehr gut']];
const moods=(o,v)=>`<div class="moods">${MOOD.map(([e,l],i)=>`<button class="chip mo ${v==i+1?'on':''}" data-a="mood" data-o="${o}" data-v="${i+1}"><span>${e}</span><small>${l}</small></button>`).join('')}</div>`;
const FR={4:['🌱','ein Mohnsamen'],5:['🌱','ein Sesamkorn'],6:['🫘','eine Linse'],7:['🫐','eine Heidelbeere'],8:['🍓','eine Himbeere'],9:['🍇','eine Weintraube'],10:['🍓','eine Erdbeere'],11:['🫒','eine Feige'],12:['🍋','eine Limette'],13:['🍑','ein Pfirsich'],14:['🍋','eine Zitrone'],15:['🍎','ein Apfel'],16:['🥑','eine Avocado'],17:['🍐','eine Birne'],18:['🫑','eine Paprika'],19:['🥭','eine Mango'],20:['🍌','eine Banane'],21:['🥕','eine Karotte'],22:['🥒','eine Zucchini'],23:['🍊','eine Grapefruit'],24:['🌽','ein Maiskolben'],25:['🥦','ein Blumenkohl'],26:['🥬','ein Kopfsalat'],27:['🥦','ein großer Blumenkohl'],28:['🍆','eine Aubergine'],29:['🎃','ein Butternusskürbis'],30:['🥬','ein Kohlkopf'],31:['🥥','eine Kokosnuss'],32:['🥬','ein Chinakohl'],33:['🍍','eine Ananas'],34:['🍈','eine Honigmelone'],35:['🍈','eine große Honigmelone'],36:['🥬','ein Romanasalat'],37:['🥬','ein Mangold'],38:['🥬','eine Lauchstange'],39:['🍉','eine kleine Wassermelone'],40:['🍉','eine Wassermelone'],41:['🎃','ein kleiner Kürbis']};
const ANC=[[4,.2,0],[8,1.6,1],[12,5.4,14],[16,11.6,100],[20,16.4,300],[24,30,600],[28,37.6,1000],[32,42.4,1700],[36,47.4,2600],[40,51.2,3400],[42,52,3600]];
function sizeOf(f){if(f<=ANC[0][0])return[ANC[0][1],ANC[0][2]];for(let i=1;i<ANC.length;i++)if(f<=ANC[i][0]){const a=ANC[i-1],b=ANC[i],k=(f-a[0])/(b[0]-a[0]);return[a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]}const l=ANC[ANC.length-1];return[l[1],l[2]]}
const tri=p=>p.w<14?1:p.w<28?2:3;
const TIPS={
m:{1:['Bei Übelkeit helfen oft kleine, häufige Mahlzeiten und ein Zwieback vor dem Aufstehen.','Such früh eine Hebamme: Plätze sind oft knapp.','Müdigkeit ist im ersten Trimester sehr häufig. Gönn dir Pausen, wenn es geht.'],
2:['Viele fühlen sich jetzt energiegeladener. Spazieren oder Schwimmen können gut tun, wenn nichts dagegen spricht.','Jetzt ist ein guter Zeitpunkt, einen Geburtsvorbereitungskurs zu buchen.','Erste Kindsbewegungen spürst du oft zwischen der 18. und 22. Woche.'],
3:['Leg Kliniktasche und Unterlagen früh bereit.','Besprich mit deiner Hebamme Geburtswünsche und die Anzeichen, bei denen du sofort anrufen sollst.','Schlafen wird schwerer: Seitenlage mit einem Kissen zwischen den Knien kann helfen.']},
f:{1:['Müdigkeit und Übelkeit sind häufig. Frag, ob es hilft, wenn du Küche und Gerüche übernimmst.','Auch deine Gefühle sind okay: Freude, Sorge, Unsicherheit. Sprich mit jemandem darüber.','Informiere dich über Elternzeit und Elterngeld, bevor Fristen drängen.'],
2:['Geh wenn möglich zu einem Vorsorgetermin mit. Das stärkt die Bindung.','Sprich mit dem Baby: Ab etwa der 20. Woche hört es Geräusche von außen.','Plant gemeinsam das Kinderzimmer und kauft in Ruhe ein.'],
3:['Klärt jetzt den Weg zur Klinik und wer wen anruft.','Pack eine eigene Tasche: Snacks, Ladekabel, Kleingeld für den Parkplatz.','Plane Elternzeit-Antrag und freie Tage rund um den Termin.']},
c:{1:['Sprecht über Wünsche und Ängste: Wer erfährt wann von der Schwangerschaft?','Teilt Aufgaben nach Kraft, nicht nach Gewohnheit.','Vereinbart früh die Vorsorge und sucht eine Hebamme.'],
2:['Nutzt die Zeit für etwas Schönes zu zweit, zum Beispiel einen Kurzurlaub.','Meldet euch gemeinsam zum Geburtsvorbereitungskurs an.','Besprecht Finanzen und Elternzeit: Wer nimmt wie lange?'],
3:['Schreibt Geburtswünsche gemeinsam auf und klärt die Rollen.','Packt die Kliniktasche zusammen und prüft die Fahrt.','Plant die ersten Wochen: Besuch, Essen, Unterstützung.']}};
const tipsCard=(r,t)=>`<div class="card"><h2>Tipps für das ${t}. Trimester</h2>${TIPS[r][t].map(x=>`<div class="hint">${x}</div>`).join('')}</div>`;
const ringH=p=>`<div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" fill="none" stroke="currentColor" opacity=".15" stroke-width="12"/><circle cx="100" cy="100" r="84" fill="none" style="stroke:var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${Math.min(p.f,40)/40*528} 528" transform="rotate(-90 100 100)"/></svg><div class="rc"><b>${Math.min(p.w+1,42)}</b><small>Woche · SSW ${p.w}+${p.d}</small></div></div>`;
function hero(p){const sz=sizeOf(p.f),fr=FR[Math.max(4,Math.min(41,p.w))];
 return `<div class="c">${ringH(p)}<h3>${tri(p)}. Trimester</h3><p class="mute"><small>${p.w} Wochen und ${p.d} Tage sind abgeschlossen.</small></p></div>
<div class="card c"><div style="font-size:56px;line-height:1.1" aria-hidden="true">${fr[0]}</div><p>Dein Baby ist ungefähr so groß wie <b>${fr[1]}</b>.</p><div class="bar"><i style="width:${Math.min(100,sz[0]/52*100)}%"></i></div><p class="mute"><small>ca. ${nf(sz[0])} cm und ca. ${gram(sz[1])}. Richtwerte, jedes Baby ist anders. Das Bild ist eine Veranschaulichung.</small></p></div>`}
const welcome=()=>`<div class="card"><h1>Willkommen bei Trio</h1><p>Wer nutzt die App?</p><button class="btn" data-a="role" data-v="m">🌿 Ich bin schwanger (Mutter)</button><button class="btn" data-a="role" data-v="f">🤝 Ich bin Vater oder Partner:in</button><button class="btn" data-a="role" data-v="c">👥 Wir nutzen sie als Paar</button><p class="mute" style="margin-top:12px"><small>Die Wahl bestimmt Ansichten und Tipps. Du kannst sie später in den Einstellungen ändern. Alle Daten bleiben auf diesem Gerät.</small></p></div>`;
const setup=()=>`<div class="card"><h2>Errechneter Geburtstermin</h2><p class="mute">Daraus berechnet Trio Woche, Größe und Tipps.</p><input type="date" id="due"><button class="btn" data-a="setdue">Weiter</button></div>`;
const TABS={m:['m','c','e'],f:['f','c','e'],c:['m','f','c','e']};

// ---------- Einstellungen ----------
function settings(full){return `<details><summary>Einstellungen</summary><div class="card"><p>Ich nutze Trio als</p><div class="row">${[['m','Mutter'],['f','Vater/Partner:in'],['c','Paar']].map(([k,l])=>`<button class="chip ${S.role===k?'on':''}" data-a="role" data-v="${k}">${l}</button>`).join('')}</div>
<p>Errechneter Termin</p><input type="date" id="due" value="${esc(S.due)}">
${full?`<p>Trinkziel pro Tag (ml)</p><input type="number" id="goal" inputmode="numeric" value="${S.goal||2000}"><p>Für den Gewichts-Orientierungsbereich (optional)</p><input type="number" id="hgt" inputmode="numeric" placeholder="Größe in cm" value="${esc(S.h)}"><input type="number" id="w0" inputmode="decimal" step="0.1" placeholder="Gewicht vor der Schwangerschaft in kg" value="${esc(S.w0)}">`:''}
<button class="btn" data-a="savecfg">Speichern</button>
${full?(S.phase==='active'?'<button class="btn s" data-a="pause">Begleitung pausieren</button><button class="btn s" data-a="loss">Die Schwangerschaft ist zu Ende gegangen</button>':'<button class="btn s" data-a="resume">Neu starten</button>'):''}
<button class="btn s" data-a="exp">Daten sichern (exportieren)</button><label class="btn s" style="display:block;text-align:center;line-height:48px;margin-top:12px">Daten wiederherstellen<input type="file" accept="application/json,.json" data-c="imp" hidden></label>
<button class="btn d" data-a="wipe">Alle Daten löschen</button><p class="mute" style="margin-top:12px"><small>Alles bleibt in diesem Browser. Es gibt keinen Server und kein Konto.</small></p></div></details>`}

// ---------- Trinktagebuch ----------
const DK={w:['💧','Wasser, Kräutertee',0],k:['☕','Kaffee',40],t:['🍵','Schwarz-/Grüntee',20],c:['🥤','Cola',10],e:['⚡','Energydrink',32],s:['🧃','Saft, Sonstiges',0]};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
function drinkCard(){
 const goal=+S.goal||2000,min=goal*.75,hi=goal*1.75,td=S.dr.map((e,i)=>[e,i]).filter(([e])=>e.t>=today0()),tot=td.reduce((a,[e])=>a+e.ml,0),caf=Math.round(td.reduce((a,[e])=>a+e.ml*DK[e.k][2]/100,0));
 const n=new Date(),h=n.getHours()+n.getMinutes()/60,exp=min*Math.min(1,Math.max(0,(h-7)/14)),left=Math.round(min-tot);
 let lv,msg;
 if(tot>hi){lv='y';msg='Sehr viel getrunken. Wenn das öfter vorkommt oder du dich unwohl fühlst, sprich mit Hebamme oder Ärzt:in.'}
 else if(tot>=min){lv='g';msg='Gut so, der Mindestwert ist erreicht.'}
 else if(tot>=exp*.8){lv='g';msg=`Auf Kurs. Noch ${left} ml bis zum Mindestwert.`}
 else if(tot>=exp*.5){lv='y';msg=`Etwas wenig für diese Tageszeit. Noch ${left} ml bis zum Mindestwert.`}
 else{lv='r';msg=`Deutlich zu wenig für diese Tageszeit. Ein Glas Wasser wäre jetzt gut. Noch ${left} ml bis zum Mindestwert.`}
 const cl=caf>200?'r':caf>=150?'y':'g';
 return `<div class="card"><h2>Trinktagebuch</h2><div class="tl ${lv}"><b>${ICON[lv]}</b><div><b>${tot} ml</b> von ${goal} ml<br><small>${msg}</small></div></div><div class="bar"><i style="width:${Math.min(100,tot/goal*100)}%"></i></div>
${caf?`<div class="fd ${cl}"><b>${ICON[cl]} Koffein heute ca. ${caf} mg</b><br><small>Richtwert: insgesamt bis ca. 200 mg pro Tag.</small></div>`:''}
<div class="row" style="margin-top:14px">${Object.entries(DK).map(([k,v])=>`<button class="chip ${DR.k===k?'on':''}" data-a="dk" data-v="${k}">${v[0]} ${v[1]}</button>`).join('')}</div>
<div class="row">${[150,250,330,500].map(m=>`<button class="chip" data-a="drink" data-v="${m}">+${m} ml</button>`).join('')}</div>
<div style="display:flex;gap:8px"><input id="dm" type="number" inputmode="numeric" placeholder="eigene Menge in ml" style="margin:0"><button class="btn" style="width:auto;margin:0;padding:0 20px" data-a="drinkc" aria-label="Hinzufügen">+</button></div>
${td.length?`<div style="margin-top:10px">${td.slice().reverse().map(([e,i])=>`<div class="ev"><span>${DK[e.k][0]} ${e.ml} ml <small>${new Date(e.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</small></span><button class="x" data-a="deldr" data-v="${i}" aria-label="Löschen">✕</button></div>`).join('')}</div>`:''}
<p class="mute"><small>Richtwert: etwa 1,5 bis 2 Liter Getränke pro Tag, mehr bei Hitze, Sport oder Übelkeit mit Erbrechen. Gibt dir deine Ärztin oder Hebamme einen anderen Wert vor, gilt dieser. Koffeingehalte sind grobe Schätzungen.</small></p></div>`}

// ---------- Gewicht ----------
function bandFn(){const h=+S.h/100,w0=+S.w0;if(!(h>.9&&w0>30))return null;const b=w0/(h*h),r=b<18.5?[.44,.58]:b<25?[.35,.5]:b<30?[.23,.33]:[.17,.27];return x=>{const f=Math.min(x,13)/13,e=Math.max(0,x-13);return[w0+.5*f+r[0]*e,w0+2*f+r[1]*e]}}
function wchart(){
 if(!S.due||!S.wt.length)return'';

  F.res.push(...strip(p.traces_tags).filter(k=>S.myAll.includes(k)).map(k=>({lvl:'y',title:'Spuren von '+alLbl(k)+' möglich',detail:'Das hast du als Allergen markiert.'})));
  F.msg=ing?'':'Zu diesem Produkt fehlen Zutaten in der Datenbank. Lies die Packung.';
 }catch(e){F.msg='Keine Verbindung zur Produktdatenbank. Prüfe dein Internet oder füge die Zutaten von Hand ein.'}
 render();
}
// ---------- Kamera-Scan: BarcodeDetector (Android/Chrome) oder ZXing (iPhone/Safari) ----------
let stream=null,zr=null,timer=null;
function stopCam(){clearInterval(timer);timer=null;if(zr){try{zr.reset()}catch(e){}zr=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
const loadZX=()=>window.ZXing?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
function gotCode(c){if(!F.cam)return;stopCam();F.cam=false;F.code=c;scan()}
async function startCam(){
 const v=$('#vid');if(!v){F.cam=false;return}if(stream||zr)return;
 try{
  if('BarcodeDetector' in window){
   const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();
   timer=setInterval(async()=>{try{const r=await det.detect(v);if(r[0])gotCode(r[0].rawValue)}catch(e){}},400);
  }else{
   await loadZX();zr=new ZXing.BrowserMultiFormatReader();
   await zr.decodeFromVideoDevice(null,'vid',r=>{if(r)gotCode(r.getText())});
  }
 }catch(e){stopCam();F.cam=false;F.msg='Die Kamera ist nicht verfügbar (Zugriff erlaubt? Internet für die Scan-Bibliothek?). Tippe die Nummer ein.';render()}
}

async function exp(){
 const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),name='trio-backup-'+new Date().toISOString().slice(0,10)+'.json';
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
